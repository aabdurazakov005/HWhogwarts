server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts_prod
spring.datasource.username=hogwarts_user
spring.datasource.password=strong_prod_password
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

logging.level.ru.hogwarts.school=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/hogwarts-app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics

app.name=Hogwarts School API
app.version=1.0.0
app.profile=production  
app.description=Production environment with PostgreSQL